services:
  app:
    build: .
    command: python -m app.server
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - audit-data:/data
    ports:
      # 宿主端口可配置：HOST_PORT=9090 docker compose up -d app
      - "${HOST_PORT:-8080}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=3).status==200 else 1)"
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 3s

  verify:
    build: .
    command: python -m verify.verify
    environment:
      APP_URL: http://app:8000
    depends_on:
      app:
        condition: service_healthy
    restart: "no"

volumes:
  audit-data:
